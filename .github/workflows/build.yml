name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.4"
        required: true
        type: string
      release:
        description: "Publish a GitHub release (tag v<version>) with the packages"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.2.4 (got '$VERSION')"
            exit 1
          fi

      # pacman packages are built by fpm, which needs bsdtar.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools

      - run: npm ci

      - name: Set version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm run typecheck
      - run: npm test

      - name: Build packages
        run: npx electron-vite build && npx electron-builder --linux AppImage deb pacman --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: asus-control-${{ env.VERSION }}-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: asus-control-${{ env.VERSION }}-deb
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: asus-control-${{ env.VERSION }}-pacman
          path: dist/*.pacman
          if-no-files-found: error

  release:
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: asus-control-${{ inputs.version }}-*
          merge-multiple: true
          path: packages

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ASUS Control $VERSION" \
            --generate-notes
