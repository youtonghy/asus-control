app-id: io.github.youtonghy.asuscontrol
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: asus-control
separate-locales: false

finish-args:
  # Windowing
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU
  - --device=dri
  # System tray
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Refresh-rate switching on GNOME
  - --talk-name=org.gnome.Mutter.DisplayConfig
  # Core dependency: asusd on the system bus
  - --system-talk-name=xyz.ljones.Asusd

modules:
  - name: asus-control
    buildsystem: simple
    build-options:
      network: true
      # Upstream flatpak-builder needs the bwrap arg; flathub's builder uses `network: true`
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/node24/bin
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        npm_config_cache: /run/build/asus-control/npm-cache
    build-commands:
      # Build the app inside the sandbox
      - npm ci --no-audit --no-fund
      - npx electron-vite build
      # App payload
      - mkdir -p /app/asus-control/resources/app
      - cp -a out resources package.json package-lock.json /app/asus-control/resources/app/
      # Production-only node_modules
      - cd /app/asus-control/resources/app && npm ci --omit=dev --no-audit --no-fund
      # Electron runtime from the pinned zip
      - unzip -q electron/electron-v44.4.5-linux-x64.zip -d /app/asus-control
      - chmod -s /app/asus-control/chrome-sandbox || true
      # Launcher
      - install -Dm755 build-aux/flatpak/asus-control.sh /app/bin/asus-control
      # Desktop file, icons, metainfo
      - install -Dm644 build-aux/flatpak/io.github.youtonghy.asuscontrol.desktop /app/share/applications/io.github.youtonghy.asuscontrol.desktop
      - install -Dm644 resources/icon.png /app/share/icons/hicolor/512x512/apps/io.github.youtonghy.asuscontrol.png
      - install -Dm644 resources/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.youtonghy.asuscontrol.svg
      - install -Dm644 build-aux/flatpak/io.github.youtonghy.asuscontrol.metainfo.xml /app/share/metainfo/io.github.youtonghy.asuscontrol.metainfo.xml
    sources:
      - type: git
        url: https://github.com/youtonghy/asus-control.git
        tag: v0.1.0
      - type: file
        url: https://github.com/electron/electron/releases/download/v44.4.5/electron-v44.4.5-linux-x64.zip
        sha256: 04586a0ec46c3283fbdaef85530f561f71f0b5e136ad0cb9ef63683615609780
        dest: electron
        only-arches:
          - x86_64
